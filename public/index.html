<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中国象棋 · Pikafish 对弈</title>
<style>
  :root{
    --bg:#14161a; --panel:#1c1f26; --panel-2:#232830; --line:#2e343e;
    --text:#e6e9ef; --muted:#9aa4b2; --accent:#4a9eff; --red:#c93b3b; --black:#2b2f36;
    --wood-a:#e8c88f; --wood-b:#dcb877; --grid:#7a5a2e;
    --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;justify-content:center;padding:18px;
  }
  .app{display:grid;grid-template-columns:minmax(320px,1fr) minmax(280px,340px);gap:20px;max-width:1560px;width:100%;overflow-x:hidden}
  @media(max-width:900px){
    .app{grid-template-columns:1fr}
    .board-wrap{max-width:none}
  }

  /* 棋盘容器。
     两个上限取较小者：
       1040px                      —— 再大就会把右侧分析面板挤到换行
       (100vh - 190px) / 1.0833    —— 让整块棋盘连同下方按钮一屏装得下
                                      （1.0833 是棋盘高宽比 600/540，190px 是棋盘外的垂直开销）
     窗口小的时候取到那个更小的值，玩家不用滚动就能看到全局；
     窗口够大时棋盘一路长到 1040px 封顶。 */
  .board-wrap{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;
    max-width:min(1040px, calc((100vh - 190px) / 1.0833));
  }
  .board-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
  .board-head h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.5px}
  .status{font-size:13px;color:var(--muted)}
  .status.turn-black{color:#8ab4f8}
  .status.turn-red{color:#f28b82}
  .status.over{color:var(--warn);font-weight:600}

  svg#board{width:100%;height:auto;display:block;border-radius:10px;cursor:pointer;user-select:none}
  .piece text{font-family:"KaiTi","STKaiti","Songti SC",serif;font-weight:700;pointer-events:none}
  .piece{cursor:pointer}
  .piece.sel circle.body{stroke:#4a9eff;stroke-width:3}
  .hint{fill:rgba(74,158,255,.55);pointer-events:none}
  .hint.cap{fill:none;stroke:#4a9eff;stroke-width:3;stroke-dasharray:6 4}
  .lastmove{fill:none;stroke:#f5c451;stroke-width:2.5;stroke-dasharray:5 4}
  .checkmark{fill:none;stroke:#f85149;stroke-width:3}

  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  button{
    background:var(--panel-2);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;
    transition:background .12s,border-color .12s;
  }
  button:hover:not(:disabled){background:#2c323c;border-color:#3d4550}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:#1f4d8f;border-color:#2a63b5}
  button.primary:hover:not(:disabled){background:#255ba6}

  .slider-row{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--muted)}
  input[type=range]{flex:1;accent-color:var(--accent)}
  .lv-name{color:var(--text);min-width:44px;text-align:right;font-weight:600}

  /* 右侧面板 */
  .side{display:flex;flex-direction:column;gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--muted);font-weight:600;letter-spacing:.6px}

  .eval-row{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
  .eval-num{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .eval-num.red{color:#f28b82}
  .eval-num.black{color:#8ab4f8}
  .eval-num.even{color:var(--muted)}
  .eval-label{font-size:12px;color:var(--muted)}
  .bar{height:7px;background:#2b3038;border-radius:4px;overflow:hidden;margin:10px 0 4px;display:flex}
  .bar .r{background:linear-gradient(90deg,#c93b3b,#e05c5c);transition:width .3s}
  .bar .b{background:linear-gradient(90deg,#3b6fc9,#5c8ce0);transition:width .3s}

  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:10px}
  .metrics b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

  .cands{margin-top:12px;display:flex;flex-direction:column;gap:6px}
  .cand{display:flex;align-items:center;gap:10px;font-size:13px;padding:5px 8px;border-radius:7px;background:var(--panel-2)}
  .cand .rk{color:var(--muted);font-size:11px;width:14px}
  .cand .mv{font-family:"KaiTi","STKaiti",serif;font-weight:700;font-size:15px;min-width:56px}
  .cand .sc{margin-left:auto;font-variant-numeric:tabular-nums;font-size:12px}
  .pos{color:#f28b82}.neg{color:#8ab4f8}.zero{color:var(--muted)}

  .moves{max-height:210px;overflow-y:auto;font-size:13px;line-height:1.9;font-family:"KaiTi","STKaiti",serif}
  .moves .ply{display:inline-block;min-width:52px}
  .moves .idx{color:var(--muted);font-size:11px;font-family:system-ui;margin-right:4px}
  .moves .cur{background:#2c3a4d;border-radius:4px;padding:0 4px}
  .empty{color:var(--muted);font-size:12px}

  .err{color:var(--bad);font-size:12px;margin-top:8px;line-height:1.5}
  .spin{display:inline-block;width:11px;height:11px;border:2px solid #3d4550;border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">

  <!-- 棋盘 -->
  <div class="board-wrap">
    <div class="board-head">
      <h1>中国象棋 · 皮卡鱼 Pikafish</h1>
      <div class="status" id="status">载入中…</div>
    </div>
    <svg id="board" viewBox="0 0 540 600" aria-label="中国象棋棋盘"></svg>
    <div class="controls">
      <button id="btn-black-first" class="primary">切换到黑方先走</button>
      <button id="btn-red-first">让引擎先走</button>
      <button id="btn-new">重新开始</button>
      <button id="btn-undo">悔棋</button>
      <button id="btn-analyze">分析当前局面</button>
    </div>
    <div class="slider-row">
      <span>难度</span>
      <input type="range" id="level" min="1" max="7" step="1" value="3">
      <span class="lv-name" id="lv-name">中级</span>
    </div>
    <div class="err" id="err"></div>
  </div>

  <!-- 右侧面板 -->
  <div class="side">
    <div class="card">
      <h2>引擎分析</h2>
      <div class="eval-row">
        <div class="eval-num even" id="eval-num">0.0</div>
        <div class="eval-label" id="eval-label">红方视角 · 尚未分析</div>
      </div>
      <div class="bar"><div class="r" id="bar-r" style="width:50%"></div><div class="b" id="bar-b" style="width:50%"></div></div>
      <div class="metrics">
        <div>深度 <b id="m-depth">—</b></div>
        <div>节点 <b id="m-nodes">—</b></div>
        <div>速度 <b id="m-nps">—</b></div>
        <div>胜率 <b id="m-wdl">—</b></div>
      </div>
      <div class="cands" id="cands"><div class="empty">点「分析当前局面」查看候选着法</div></div>
    </div>

    <div class="card">
      <h2>棋谱</h2>
      <div class="moves" id="moves"><div class="empty">尚未走子</div></div>
    </div>
  </div>
</div>

<script type="module">
// ---------------------------------------------------------------------------
// 常量与几何
// ---------------------------------------------------------------------------
const FILES = 9, RANKS = 10;
const CELL = 56, MARGIN_X = 38, MARGIN_Y = 30, R = 24;
const idx = (f, r) => r * 9 + f;
const fileOf = (i) => i % 9, rankOf = (i) => Math.floor(i / 9);
// SVG 坐标：rank 0 在上方
const cx = (f) => MARGIN_X + f * CELL;
const cy = (r) => MARGIN_Y + r * CELL;

const PIECE_NAMES = { K:'帅',A:'仕',B:'相',N:'马',R:'车',C:'炮',P:'兵', k:'将',a:'士',b:'象',n:'马',r:'车',c:'炮',p:'卒' };
const isRedPiece = (p) => p !== '.' && p === p.toUpperCase();

const svg = document.getElementById('board');
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};

// ---------------------------------------------------------------------------
// 状态
// ---------------------------------------------------------------------------
let state = null;
let selected = null;      // 当前选中的起点索引
let legalTargets = [];    // 选中棋子的合法落点
let busy = false;

// ---------------------------------------------------------------------------
// 静态棋盘（只画一次）
//
// ⚠️ 分层顺序（z-order）在 SVG 里就是 DOM 顺序，画错一层就会出现
//    "DOM 里有棋子但屏幕上看不见" ——不要改动下面的 createElement 次序。
//      0 底：木纹背景 + defs
//      1    ：棋盘线、九宫、楚河汉界
//      2    ：落点提示、上一步标记
//      3 顶：棋子
// ---------------------------------------------------------------------------
const layerBase = el('g');
const layerMarks = el('g');
const layerPieces = el('g');
svg.append(layerBase, layerMarks, layerPieces);

function drawBoardBase() {
  const defs = el('defs');
  const grad = el('linearGradient', { id:'woodGrad', x1:'0', y1:'0', x2:'1', y2:'1' });
  grad.append(el('stop', { offset:'0%',  'stop-color':'#e8c88f' }));
  grad.append(el('stop', { offset:'100%','stop-color':'#dcb877' }));
  defs.append(grad);
  // 棋子渐变
  const pg = el('radialGradient', { id:'pieceLight', cx:'38%', cy:'32%', r:'75%' });
  pg.append(el('stop', { offset:'0%', 'stop-color':'#fffdf7' }));
  pg.append(el('stop', { offset:'100%','stop-color':'#e6dcc6' }));
  defs.append(pg);
  const pg2 = el('radialGradient', { id:'pieceDark', cx:'38%', cy:'32%', r:'75%' });
  pg2.append(el('stop', { offset:'0%', 'stop-color':'#4a5058' }));
  pg2.append(el('stop', { offset:'100%','stop-color':'#22262c' }));
  defs.append(pg2);

  // 背景与棋盘线都属于最底层
  layerBase.append(defs);
  layerBase.append(el('rect', { x:0, y:0, width:540, height:600, rx:10, fill:'url(#woodGrad)' }));

  const g = el('g', { stroke:'#7a5a2e', 'stroke-width':1.4, 'stroke-linecap':'round' });

  // 横线（10 条，贯通）
  for (let r = 0; r < RANKS; r++) {
    g.append(el('line', { x1:cx(0), y1:cy(r), x2:cx(8), y2:cy(r) }));
  }
  // 竖线：河界处中间 7 条断开
  for (let f = 0; f < FILES; f++) {
    if (f === 0 || f === 8) {
      g.append(el('line', { x1:cx(f), y1:cy(0), x2:cx(f), y2:cy(9) }));
    } else {
      g.append(el('line', { x1:cx(f), y1:cy(0), x2:cx(f), y2:cy(4) }));
      g.append(el('line', { x1:cx(f), y1:cy(5), x2:cx(f), y2:cy(9) }));
    }
  }
  // 九宫斜线
  for (const top of [0, 7]) {
    g.append(el('line', { x1:cx(3), y1:cy(top),   x2:cx(5), y2:cy(top+2) }));
    g.append(el('line', { x1:cx(5), y1:cy(top),   x2:cx(3), y2:cy(top+2) }));
  }
  // 外框加粗
  g.append(el('rect', {
    x:cx(0)-5, y:cy(0)-5, width:8*CELL+10, height:9*CELL+10,
    fill:'none', 'stroke-width':2.4,
  }));
  layerBase.append(g);

  // 楚河汉界
  const river = el('g', { fill:'#8a6535', 'font-family':'"KaiTi","STKaiti",serif',
                          'font-size':26, 'font-weight':700, 'letter-spacing':6, opacity:.85 });
  const t1 = el('text', { x:cx(1.4), y:cy(4.5)+9 }); t1.textContent = '楚 河';
  const t2 = el('text', { x:cx(5.2), y:cy(4.5)+9 }); t2.textContent = '漢 界';
  river.append(t1, t2);
  layerBase.append(river);
}

// ---------------------------------------------------------------------------
// 动态层：棋子、提示、标记（引用在 drawBoardBase 之前就建好了，保证 z-order）
// ---------------------------------------------------------------------------

function render() {
  layerPieces.replaceChildren();
  layerMarks.replaceChildren();
  if (!state) return;

  const board = state.board;
  const last = state.lastMove;

  // 上一步标记
  // ⚠️ state.lastMove 是**引擎坐标**（rank 0 在底部），必须翻转回内部 rank，
  //    否则标记会画在棋盘上下镜像的位置。这里曾经就漏过翻转。
  if (last) {
    for (const engineSq of [last.slice(0,2), last.slice(2,4)]) {
      const f = engineSq.charCodeAt(0) - 97;
      const r = 9 - Number(engineSq[1]);
      if (f < 0 || f > 8 || r < 0 || r > 9) continue;
      layerMarks.append(el('rect', {
        x:cx(f)-R-3, y:cy(r)-R-3, width:(R+3)*2, height:(R+3)*2, rx:6, class:'lastmove',
      }));
    }
  }

  // 合法落点提示
  for (const t of legalTargets) {
    const f = fileOf(t), r = rankOf(t);
    const occupied = board[t] !== '.';
    layerMarks.append(el('circle', {
      cx:cx(f), cy:cy(r), r: occupied ? R : 8,
      class: occupied ? 'hint cap' : 'hint',
    }));
  }

  // 棋子
  for (let i = 0; i < 90; i++) {
    const p = board[i];
    if (p === '.') continue;
    const f = fileOf(i), r = rankOf(i);
    const red = isRedPiece(p);
    const g = el('g', { class:'piece' + (selected === i ? ' sel' : ''), 'data-idx':String(i) });
    g.append(el('circle', { cx:cx(f), cy:cy(r), r:R, class:'body',
      fill: red ? 'url(#pieceLight)' : 'url(#pieceDark)',
      stroke: red ? '#a8332f' : '#12151a', 'stroke-width':2 }));
    g.append(el('circle', { cx:cx(f), cy:cy(r), r:R-4, fill:'none',
      stroke: red ? 'rgba(168,51,47,.55)' : 'rgba(255,255,255,.28)', 'stroke-width':1 }));
    const t = el('text', { x:cx(f), y:cy(r)+8, 'text-anchor':'middle', 'font-size':26,
      fill: red ? '#b3271f' : '#f0f2f5' });
    t.textContent = PIECE_NAMES[p];
    g.append(t);
    // 被将军的将/帅加红圈
    if ((p === 'K' || p === 'k') && state.check && ((p === 'K') === (state.turn === 'red'))) {
      layerMarks.append(el('circle', { cx:cx(f), cy:cy(r), r:R+4, class:'checkmark' }));
    }
    layerPieces.append(g);
  }
}

// ---------------------------------------------------------------------------
// 交互
// ---------------------------------------------------------------------------
svg.addEventListener('click', async (ev) => {
  if (!state || busy || state.result) return;
  // 服务端说现在不能走子（例如红方回合、且没开黑方先走），直接忽略点击
  if (state.canUserMove === false) return;
  const target = ev.target.closest('.piece');
  const rect = svg.getBoundingClientRect();
  const scale = 540 / rect.width;

  // 点到棋子：选中 / 换选
  if (target) {
    const i = Number(target.dataset.idx);
    const p = state.board[i];
    if (selected !== null && legalTargets.includes(i)) return doMove(selected, i);
    // 用户执黑：只能选黑棋。
    // 注意**不能**用 state.turn 判断 —— 黑方先走模式下局面记的是红方回合，
    // 但此时允许用户走黑棋。谁能走由服务端给的 canUserMove 决定。
    if (isRedPiece(p)) { selected = null; legalTargets = []; render(); return; }
    selected = i;
    legalTargets = await fetchLegal(i);
    render();
    return;
  }

  // 点到空白/网格：若有选中，尝试走子
  if (selected !== null) {
    const px = (ev.clientX - rect.left) * scale;
    const py = (ev.clientY - rect.top) * scale;
    const f = Math.round((px - MARGIN_X) / CELL);
    const r = Math.round((py - MARGIN_Y) / CELL);
    if (f >= 0 && f < 9 && r >= 0 && r < 10) {
      const i = idx(f, r);
      if (legalTargets.includes(i)) return doMove(selected, i);
    }
  }
  selected = null; legalTargets = []; render();
});

async function fetchLegal(from) {
  try {
    const r = await fetch('/api/legal', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ from }),
    });
    const d = await r.json();
    return d.targets ?? [];
  } catch { return []; }
}

async function doMove(from, to) {
  busy = true;
  selected = null; legalTargets = []; render();
  try {
    const r = await fetch('/api/move', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ from, to }),
    });
    const d = await r.json();
    if (!r.ok) showErr(d.error ?? '走子失败');
    if (d.state) applyState(d.state);
  } catch (e) { showErr('网络错误：' + e.message); }
  busy = false;
  render();
}

function showErr(msg) {
  const e = document.getElementById('err');
  e.textContent = msg ? '⚠ ' + msg : '';
}

// ---------------------------------------------------------------------------
// 渲染状态
// ---------------------------------------------------------------------------
const fmt = (n) => n === null || n === undefined ? '—' : n.toLocaleString('en-US');
const fmtScore = (cp, mate) => {
  if (mate !== null && mate !== undefined) return (mate > 0 ? '+M' : '-M') + Math.abs(mate);
  if (cp === null || cp === undefined) return '—';
  return (cp >= 0 ? '+' : '') + (cp / 100).toFixed(2);
};

function applyState(s) {
  state = s;
  const st = document.getElementById('status');

  if (s.result) {
    st.className = 'status over';
    st.textContent = `对局结束 · ${s.result.winnerName}胜（${s.result.reason}）`;
  } else if (s.thinking) {
    st.className = 'status';
    st.innerHTML = '<span class="spin"></span> 引擎思考中…';
  } else if (s.canUserMove) {
    // 注意：黑方先走模式下局面记的是"红方回合"，但实际该用户走黑棋，
    // 所以这里以 canUserMove 为准，不能直接看 s.turn
    st.className = 'status turn-black';
    st.textContent = s.check ? '黑方被将军 · 轮到你走' : '轮到你走（黑方）';
  } else if (s.turn === 'black') {
    st.className = 'status turn-black';
    st.textContent = '轮到你走（黑方）';
  } else if (s.atStart) {
    st.className = 'status turn-red';
    st.textContent = '轮到红方 · 点「切换到黑方先走」或「让引擎先走」';
  } else {
    st.className = 'status turn-red';
    st.textContent = s.check ? '红方被将军 · 引擎应手' : '轮到红方（引擎）';
  }

  if (s.engineError) showErr(s.engineError);

  // 难度
  const lv = document.getElementById('level');
  if (String(lv.value) !== String(s.level)) lv.value = s.level;
  const lvInfo = (s.levels ?? []).find((x) => x.value === s.level);
  document.getElementById('lv-name').textContent = lvInfo ? lvInfo.name : '—';

  // 按钮可用性
  // 两个"谁先走"按钮只在开局、且引擎没在忙时可用
  document.getElementById('btn-black-first').disabled = busy || !s.atStart || s.blackFirst || Boolean(s.result);
  document.getElementById('btn-red-first').disabled = busy || !s.atStart || s.blackFirst || !s.engineReady || Boolean(s.result);
  document.getElementById('btn-new').disabled = busy;
  document.getElementById('btn-undo').disabled = busy || s.moves.length === 0;
  document.getElementById('btn-analyze').disabled = busy || !s.engineReady;

  // 棋盘与棋子必须跟着状态重画 —— 少了这一句，开局和每次走子后棋盘都不会更新
  render();
  renderAnalysis(s.analysis);
  renderMoves(s);
}

function renderAnalysis(a) {
  const num = document.getElementById('eval-num');
  const label = document.getElementById('eval-label');
  const barR = document.getElementById('bar-r'), barB = document.getElementById('bar-b');

  if (!a) {
    num.textContent = '0.0'; num.className = 'eval-num even';
    label.textContent = '红方视角 · 尚未分析';
    barR.style.width = '50%'; barB.style.width = '50%';
    document.getElementById('m-depth').textContent = '—';
    document.getElementById('m-nodes').textContent = '—';
    document.getElementById('m-nps').textContent = '—';
    document.getElementById('m-wdl').textContent = '—';
    document.getElementById('cands').innerHTML = '<div class="empty">点「分析当前局面」查看候选着法</div>';
    return;
  }

  num.textContent = fmtScore(a.scoreCp, a.scoreMate);
  const cp = a.scoreMate !== null && a.scoreMate !== undefined
    ? (a.scoreMate > 0 ? 2000 : -2000) : (a.scoreCp ?? 0);
  num.className = 'eval-num ' + (cp > 30 ? 'red' : cp < -30 ? 'black' : 'even');
  // 说清这次分析的是哪一方 —— 引擎应手之后，分析的是"引擎那一步"之前的局面，
  // 候选着法因此是红方的；不标出来会让人以为面板给错了。
  const who = a.sideToMove === 'black' ? '黑方候选' : '红方候选';
  label.textContent = `红方视角 · 深度 ${a.depth ?? '—'} · ${who}`;
  // 用 tanh 把分差映射到 0-100%
  const wr = 50 + 50 * Math.tanh(cp / 600);
  barR.style.width = wr.toFixed(1) + '%';
  barB.style.width = (100 - wr).toFixed(1) + '%';

  document.getElementById('m-depth').textContent = a.depth ?? '—';
  document.getElementById('m-nodes').textContent = a.nodes ? (a.nodes / 1e6).toFixed(2) + 'M' : '—';
  document.getElementById('m-nps').textContent = a.nps ? (a.nps / 1e6).toFixed(2) + 'M' : '—';
  document.getElementById('m-wdl').textContent = a.wdl
    ? Math.round(a.wdl.win / 10) + '% / ' + Math.round(a.wdl.draw / 10) + '% / ' + Math.round(a.wdl.loss / 10) + '%'
    : '—';

  const box = document.getElementById('cands');
  box.replaceChildren();
  for (const c of (a.candidates ?? [])) {
    const row = document.createElement('div');
    row.className = 'cand';
    const sc = c.scoreMate !== null && c.scoreMate !== undefined
      ? 'M' + Math.abs(c.scoreMate)
      : (c.scoreCp === null ? '—' : (c.scoreCp / 100).toFixed(2));
    const cls = c.scoreCp > 30 ? 'pos' : c.scoreCp < -30 ? 'neg' : 'zero';
    // 用分析时的棋盘快照翻译棋子名（用当前棋盘会显示成 ?）
    row.innerHTML = `<span class="rk">${c.rank}</span><span class="mv">${uciToCn(c.uci, a.board)}</span>`
      + `<span class="sc ${cls}">${sc}</span>`;
    box.append(row);
  }
  if (!(a.candidates ?? []).length) box.innerHTML = '<div class="empty">无候选着法</div>';
}

/**
 * 把 UCI 着法粗转成中文显示（面板用，不追求与棋谱记法完全一致）。
 *
 * ⚠️ 这里有两个坑：
 *  1. 引擎坐标的 rank 与内部棋盘相反（引擎 rank 0 在底部，内部 rank 0 在顶部），
 *     查棋子必须做 `9 - rank` 翻转，否则会查到错误的格子。
 *  2. 查棋子要用**分析那一刻的棋盘快照**（boardAtAnalysis），不能用当前棋盘 ——
 *     分析之后局面往往又走了一步，起点上的棋子已经移走，用当前棋盘会显示成 "?"。
 */
function uciToCn(uci, boardAtAnalysis) {
  if (!uci || uci.length < 4) return uci ?? '—';
  const eFromFile = uci.charCodeAt(0) - 97, eFromRank = Number(uci[1]);
  const eToFile = uci.charCodeAt(2) - 97, eToRank = Number(uci[3]);
  const from = [eFromFile, 9 - eFromRank];
  const to = [eToFile, 9 - eToRank];
  const board = boardAtAnalysis ?? state?.board;
  const p = board?.[idx(from[0], from[1])];
  const name = p && p !== '.' ? PIECE_NAMES[p] : '?';
  const red = p && p !== '.' ? isRedPiece(p) : true;
  // 纵线号：红方从右往左（file 8 = 一），黑方从左往右（file 0 = 1）
  const fileNum = (f) => (red ? 9 - f : f + 1);
  const CN = ['一','二','三','四','五','六','七','八','九'];
  const ns = (n) => (red ? CN[n - 1] : String(n));
  if (from[1] === to[1]) return `${name}${ns(fileNum(from[0]))}平${ns(fileNum(to[0]))}`;
  const fwd = red ? to[1] < from[1] : to[1] > from[1];
  return `${name}${ns(fileNum(from[0]))}${fwd ? '进' : '退'}${ns(Math.abs(to[1] - from[1]))}`;
}

function renderMoves(s) {
  const box = document.getElementById('moves');
  if (!s.notation?.length) { box.innerHTML = '<div class="empty">尚未走子</div>'; return; }
  box.replaceChildren();
  for (let i = 0; i < s.notation.length; i += 2) {
    const line = document.createElement('div');
    const n = i / 2 + 1;
    const isCur = i + 2 >= s.notation.length;
    line.innerHTML = `<span class="idx">${String(n).padStart(2, ' ')}</span>`
      + `<span class="ply ${isCur ? 'cur' : ''}">${s.notation[i] ?? ''}</span>`
      + `<span class="ply ${i + 1 === s.notation.length - 1 ? 'cur' : ''}">${s.notation[i+1] ?? ''}</span>`;
    box.append(line);
  }
  box.scrollTop = box.scrollHeight;
}

// ---------------------------------------------------------------------------
// 按钮
// ---------------------------------------------------------------------------
async function post(path, body) {
  busy = true;
  try {
    const r = await fetch(path, {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify(body ?? {}),
    });
    const d = await r.json();
    if (!r.ok) showErr(d.error ?? '操作失败');
    else showErr('');
    // 服务端返回的 state 是权威状态；必须用它重画，否则分析面板会停在旧结果上
    if (d.state) applyState(d.state);
  } catch (e) { showErr('网络错误：' + e.message); }
  busy = false;
  if (state) applyState(state);
}

document.getElementById('btn-black-first').onclick = () => post('/api/engine-first');
document.getElementById('btn-red-first').onclick = () => post('/api/red-first');
document.getElementById('btn-new').onclick = () => { selected = null; legalTargets = []; post('/api/new'); };
document.getElementById('btn-undo').onclick = () => { selected = null; legalTargets = []; post('/api/undo'); };
document.getElementById('btn-analyze').onclick = () => post('/api/analyze', { movetime: 1500 });

const lv = document.getElementById('level');
lv.oninput = () => {
  const info = (state?.levels ?? []).find((x) => x.value === Number(lv.value));
  document.getElementById('lv-name').textContent = info ? info.name : '';
};
lv.onchange = () => post('/api/level', { level: Number(lv.value) });

// ---------------------------------------------------------------------------
// 启动
// ---------------------------------------------------------------------------
drawBoardBase();
(async function init() {
  try {
    const r = await fetch('/api/state');
    applyState(await r.json());
  } catch (e) {
    document.getElementById('status').textContent = '无法连接服务';
    showErr(e.message);
  }
})();

/**
 * 轻量后台刷新。
 *
 * 为什么需要：引擎应手是服务端自己完成的，服务端不会主动通知页面。
 * 没有这个轮询，引擎走完后界面会一直停在旧局面（棋子、状态、棋谱都不动），
 * 直到用户碰一下任意按钮才更新 —— 表现为"点了没反应"。
 *
 * ⚠️ 判断条件**不能**写成 `state.turn === 'red'`：
 * `turn` 是"该谁走"，用户在**黑方回合**（turn === 'black'）恰恰是最需要刷新的时刻——
 * 引擎刚应完手、或者外部调了 /api/new、/api/undo 改了状态。
 * 早先版本就是因为用 turn 判断，导致黑方回合完全不轮询，
 * 页面能一直停在旧局面上（重置了都看不出来）。
 * 现在改用服务端给的 canUserMove：**只有确认"轮到用户且没人在动"时才停**。
 */
let refreshing = false;

/**
 * 服务端状态的指纹。用它判断"要不要重画"。
 *
 * 早先只比较 `moves.length`，那会漏掉两类变化：**重新开始**（步数从 N 回到 0，
 * 若原本就是 0 则完全看不出）和**分析结果更新**（步数没变）。
 */
function stateSignature(s) {
  return [
    s.moves.length,
    s.moves[s.moves.length - 1] ?? '',
    s.thinking ? 1 : 0,
    s.result ? 1 : 0,
    s.analysis ? s.analysis.depth : 0,
    s.blackFirst ? 1 : 0,
    s.canUserMove ? 1 : 0,
  ].join('|');
}

setInterval(async () => {
  if (refreshing || busy || !state) return;
  // 用户正在选子/看落点提示时不要重画，否则选中态会被清掉
  if (selected !== null) return;
  // 只有"轮不到用户走 / 引擎在思考"时才可能有服务端变化
  const shouldPoll = state.thinking || !state.canUserMove;
  if (!shouldPoll) return;
  refreshing = true;
  try {
    const r = await fetch('/api/state');
    const s = await r.json();
    if (stateSignature(s) !== stateSignature(state)) applyState(s);
  } catch { /* 网络抖动忽略，下一轮再试 */ }
  refreshing = false;
}, 1200);

// 键盘快捷键
addEventListener('keydown', (e) => {
  if (e.key === 'u') document.getElementById('btn-undo').click();
  if (e.key === 'n') document.getElementById('btn-new').click();
  if (e.key === 'a') document.getElementById('btn-analyze').click();
  if (e.key === 'b') document.getElementById('btn-black-first').click();
  if (e.key === 'r') document.getElementById('btn-red-first').click();
});
</script>
